<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchases</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e0e0d" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- defer: charts are drawn on window load, so this needn't block first paint.
       If it fails (offline first visit) the app still works; charts just hide. -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Buttons declare what they do with data-action; script.js wires them up
       with one delegated listener. No inline onclick, so nothing here has to
       be a global. -->
  <header class="appbar">
    <button class="icon-btn" aria-label="Menu" data-action="toggle-menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="appbar-logo">Purchases</span>
    <button id="googleSignInBtn" class="signin-btn" data-action="sign-in">
      <span class="material-symbols-outlined">login</span>
      Sign in
    </button>
  </header>

  <!-- Dims the page behind the open drawer, and closes it on a tap outside. -->
  <div id="scrim" class="scrim" data-action="toggle-menu"></div>

  <nav id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="menu-header">
      <span class="appbar-logo menu-logo">Purchases</span>
      <button class="icon-btn icon-btn-light" aria-label="Close" data-action="toggle-menu">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <ul>
      <li><button class="menu-link" data-action="go-page" data-page="home">
        <span class="material-symbols-outlined">home</span>Home
      </button></li>
      <li><button class="menu-link" data-action="go-page" data-page="categories">
        <span class="material-symbols-outlined">bar_chart</span>Categories
      </button></li>
      <li><button class="menu-link" data-action="go-page" data-page="purchases">
        <span class="material-symbols-outlined">receipt_long</span>Purchases
      </button></li>
      <li><button class="menu-link" data-action="clear-device">
        <span class="material-symbols-outlined">delete_sweep</span>Clear device
      </button></li>
      <li><button class="menu-link menu-danger" data-action="sign-out">
        <span class="material-symbols-outlined">logout</span>Sign out &amp; clear
      </button></li>
    </ul>
  </nav>

  <main>
    <!-- HOME -->
    <section id="page-home" class="page active" aria-label="Home">
      <!-- The weekly goal is the headline. It's the one question the app
           exists to answer, and unlike everything below it, it is NOT scoped
           by the filter row — it always means the current Sunday-Saturday
           week. Filled in by renderWeeklyGoal(). -->
      <div class="hero" id="goalHero">
        <div class="hero-label">This week</div>
        <div id="goalBody"></div>
      </div>

      <!-- The month total, demoted out of the headline but still on screen.
           updateHero() writes these three. -->
      <div class="stat-strip">
        <div class="stat">
          <div class="stat-label" id="heroMonthLabel">—</div>
          <div class="stat-value" id="heroTotal">$0.00</div>
          <div class="stat-sub"   id="heroSub">&nbsp;</div>
        </div>
        <div class="stat">
          <div class="stat-label">Last week</div>
          <div class="stat-value" id="lastWeekTotal">$0.00</div>
          <div class="stat-sub"   id="lastWeekSub">&nbsp;</div>
        </div>
      </div>

      <!-- Only appears when creating the Sheet has failed. -->
      <section class="card" id="sheetHelper" style="display:none;">
        <div class="card-label">Google Sheet</div>
        <p class="subtle">Couldn't create your Google Sheet.</p>
        <div class="btn-row" style="margin-top:12px;margin-bottom:0;">
          <button class="btn-primary" data-action="create-sheet">Create Sheet</button>
        </div>
      </section>

      <!-- Mount point for the shared filter row. The Purchases page has one
           too and both drive the same range; script.js fills them from
           #filterRowTpl and keeps their values in step. -->
      <div class="filter-mount"></div>

      <section class="card" id="trendCard">
        <div class="card-label" id="trendLabel">Spending over time</div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
        <p class="chart-note" id="trendNote"></p>
      </section>

      <section class="card">
        <div class="card-label">By category</div>
        <div id="categoryBars" class="cat-bars"></div>
      </section>
    </section>

    <!-- PURCHASES -->
    <section id="page-purchases" class="page" aria-label="All purchases">
      <div class="filter-mount"></div>

      <section class="card">
        <div class="card-label" id="purchaseListLabel">All purchases</div>
        <div id="purchaseList" class="purchase-list"></div>
      </section>
    </section>

    <!-- CATEGORIES -->
    <section id="page-categories" class="page" aria-label="By category">
      <section class="card">
        <div class="card-label">By category</div>
        <p class="subtle">All purchases stored on this device.</p>
        <table id="categoryTable" class="cat-table">
          <thead><tr><th>Category</th><th>Total</th><th>Share</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </section>
  </main>

  <!-- Sync messages land here rather than in a card, now that the entry form
       is a modal. Hidden until there is something to say. -->
  <div id="syncStatus" class="toast" role="status" hidden></div>

  <footer class="actionbar">
    <span class="actionbar-total" id="totalSpent">Total: $0.00</span>
    <button class="fab" data-action="open-add">
      <span class="material-symbols-outlined">add</span>New entry
    </button>
  </footer>

  <!-- The entry form, opened from the action bar. Same field ids the form
       always had, so addPurchase() reads them exactly as before. -->
  <template id="addEntryTpl">
    <div class="modal-bg" id="addModal">
      <div class="modal-box">
        <div class="card-label">New entry</div>
        <div class="input-grid">
          <label class="sr-only" for="itemName">Item name</label>
          <input id="itemName"   type="text"   placeholder="Item name" />
          <label class="sr-only" for="itemAmount">Amount</label>
          <input id="itemAmount" type="number" step="0.01" placeholder="$0.00" class="mono" />
          <label class="sr-only" for="itemDate">Date</label>
          <input id="itemDate"   type="date"   class="mono" />
        </div>
        <div class="cat-row">
          <label class="sr-only" for="itemCategory">Category</label>
          <!-- Options are filled in from CATEGORIES when the modal opens. -->
          <select id="itemCategory">
            <option value="">Category — auto-detect if blank</option>
          </select>
        </div>
        <div class="btn-row" style="margin-top:14px;margin-bottom:0;">
          <button class="btn-primary" data-action="add-purchase">Add entry</button>
          <button class="btn-ghost"   data-action="close-add">Cancel</button>
        </div>
      </div>
    </div>
  </template>

  <!-- One definition of the filter row, cloned into every .filter-mount, so
       the two copies can't drift apart. The dropdown's options are generated
       from the months that actually have data, hence the empty <select>. -->
  <template id="filterRowTpl">
    <div class="filter-row">
      <span class="filter-group">
        <span class="filter-label">Showing</span>
        <select class="range-select month-select mono" aria-label="Show a preset period"></select>
      </span>
      <span class="filter-group">
        <span class="filter-label">From</span>
        <input type="date" class="range-from mono" aria-label="Show purchases from this date onward" />
        <button type="button" class="range-clear" data-action="clear-range" aria-label="Clear the from date" hidden>
          <span class="material-symbols-outlined">close</span>
        </button>
      </span>
    </div>
  </template>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
